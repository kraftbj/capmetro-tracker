<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!--
  Shareable URLs put this page at a depth its assets are not at. From
  /route/4/eb a relative <script src="format.js"> resolves to
  /route/4/format.js, which no server answers with the script: nginx matches it
  against `location ~* \.(js|css)$`, declared before the app-path fallback, and
  404s; the e2e fixture server has no such ordering and returns this file's own
  HTML. Either way every script is lost and the board renders nothing.

  This runs before any of those tags are parsed and sets a <base> so they all
  resolve against the directory the board is served from. It must stay inline
  and first: an external script would need the same base to load, and a tag
  after the stylesheet would come too late for it.

  It is deliberately silent on file://, where a path means nothing and a
  <base href="/"> would send every asset to the root of the filesystem.

  The rule here is the same one client/urls.js states as baseFor(), and the two
  MUST agree. They are apart only because this one has to run before any script
  file can be fetched. tests/e2e/urls.spec.mjs covers this one by loading the
  board at depth and checking the scripts actually ran.
-->
<script>
(function () {
  if (location.protocol === 'file:') return;
  var p = location.pathname;
  /*
   * A path beginning "//" is protocol-relative once it becomes a base href:
   * //evil.com/route/x would resolve every relative script tag against
   * evil.com. nginx collapses that to /evil.com/route/x today, so it cannot
   * arrive, but "cannot arrive today" is a property of merge_slashes rather
   * than of this file -- and the CSP that would otherwise catch it is now
   * base-uri 'self' rather than 'none'. Bail instead of relying on either.
   */
  if (p.charAt(0) !== '/' || p.charAt(1) === '/') return;
  var m = p.match(/^(.*?\/)(?:route|buses|trip|saved|stops)(?:\/|$)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<!-- The stops link keeps its plan in the '#' fragment, which browsers never send.
     This makes that hold even where the vhost does not reach: a board opened from
     disk, or served by anything other than the shipped nginx config. -->
<meta name="referrer" content="no-referrer">
<meta name="description" content="Live CapMetro bus positions and schedule adherence for one route, on a phone.">
<title>Dillo Bus Board</title>

<!--
  Static, no build step, no framework. Open this file from disk and it runs
  against the committed golden fixture; serve it next to /api/route/*.json and
  it runs against the live feed instead.

  Scripts load in dependency order and share one `window.CMB` namespace.
  Classic scripts, not modules, because ES modules are blocked on file:// URLs
  and being openable from disk is a requirement, not a convenience.
-->
<link rel="stylesheet" href="styles.css">
<!-- No font preload: a crossorigin preload is rejected on file:// URLs, and the
     board has to open from disk. font-display:swap covers the first paint. -->
</head>
<body>

<div id="app">
  <noscript>
    <p style="padding:16px">
      This board renders live vehicle positions in the browser and needs
      JavaScript. The data itself is a plain JSON file at
      <code>api/route/4.json</code> if you would rather read it directly.
    </p>
  </noscript>
</div>

<script src="data/route-4-20260819.js"></script>
<script src="data/departures-4-20260819.js"></script>
<script src="format.js"></script>
<script src="adherence.js"></script>

<script src="stopboard.js"></script>
<!-- plan.js reuses watch.js's schedule/live join and stopboard.js's ranking,
     so it loads after both. -->
<script src="plan.js"></script>
<script src="chain.js"></script>
<script src="trip.js"></script>
<script src="urls.js"></script>
<script src="app.js"></script>
</body>
</html>
