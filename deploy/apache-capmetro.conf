# CapMetro dispatch board — Apache vhost.
#
# `sudo deploy/install.sh --domain <host>` prints this sequence already filled
# in, and refuses a hostname that cannot work. Prefer it. By hand:
#
#   sed -e 's/@DOMAIN@/bus.dillo.dev/g' -e 's#@WEBROOT@#/var/www/capmetro#g' \
#     deploy/apache-capmetro.conf > /tmp/capmetro-vhost.new
#   diff -u /etc/apache2/sites-available/capmetro.conf /tmp/capmetro-vhost.new
#   [ -s /tmp/capmetro-vhost.new ] && ! grep -q '@[A-Z_]*@' /tmp/capmetro-vhost.new \
#     && cp /tmp/capmetro-vhost.new /etc/apache2/sites-available/capmetro.conf
#   a2enmod headers expires && a2ensite capmetro
#
# Through a temp file, with a diff and a guard, not straight over the installed
# file. `>` truncates before sed runs, so a failed sed leaves a 0-byte vhost --
# which configtest accepts, and the host then falls through to whatever else the
# box serves, with health.json still reading ok:true. certbot also owns the TLS
# virtual host in the installed file, so overwriting it drops the board off
# HTTPS with the certificate still valid and unreferenced. Read the diff.
#
# Put the real host in that sed, never a stand-in. A ServerName that nothing
# resolves to is what took the board down once already, and it is invisible: the
# config is valid, the reload is clean, and the check still reads ok:true.
# install.sh refuses that whole class of name.
#
# Needs mod_headers. Static files only: the runtime is a CLI job on a timer, so
# there is no PHP handler here and that is not an omission.
<VirtualHost *:80>
    ServerName @DOMAIN@
    DocumentRoot @WEBROOT@
    DirectoryIndex index.html

    <Directory @WEBROOT@>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
        # Nothing in this tree is meant to execute. Belt and braces if a future
        # php module is enabled server-wide.
        php_admin_flag engine off
    </Directory>

    # Shareable URLs: /route/4/eb, /buses, /trip/1234, /saved, /stops. None are files, so
    # a real file wins when one exists and these five prefixes otherwise fall
    # through to the board, which reads the path and renders the right view.
    #
    # Scoped to the five app verbs rather than a blanket FallbackResource, for
    # the reason the nginx vhost gives: a blanket fallback answers 200 with the
    # board's HTML for every missing asset, so a mistyped script tag looks like
    # it loaded. Anything outside these five still 404s.
    <LocationMatch "^/(route|buses|trip|saved|stops)(/|$)">
        FallbackResource /index.html
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

    # Contract section 11: /api/* is regenerated every 60s and must never cache.
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-cache"
    </LocationMatch>

    # Contract section 16: the departure boards carry no realtime field and turn
    # over only when service_date or feed_version changes, both in the payload.
    # This LocationMatch is second so it wins over the broader /api/ rule above.
    <LocationMatch "^/api/departures/">
        Header always set Cache-Control "public, max-age=21600"
    </LocationMatch>

    # index.html names every other file, so a deploy is invisible if it caches.
    <Location "/index.html">
        Header always set Cache-Control "no-cache"
    </Location>

    <LocationMatch "^/fonts/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <FilesMatch "\.(js|css)$">
        Header always set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    # The web app manifest names every icon and the start URL, and is 1 KB, so it
    # revalidates like index.html rather than caching. sw.js is covered by the
    # js rule above, which is what a service worker script wants: every browser
    # caps its own update check at 24 hours regardless, and must-revalidate makes
    # that check a conditional request.
    <Files "manifest.webmanifest">
        Header always set Cache-Control "public, max-age=0, must-revalidate"
    </Files>

    # Icons and favicons are fetched by the launcher and the tab rather than by
    # the page, and change roughly never. A day is long enough not to refetch on
    # a home screen and short enough that a recut icon lands on its own.
    <FilesMatch "\.(png|svg|ico)$">
        Header always set Cache-Control "public, max-age=86400"
    </FilesMatch>

    <FilesMatch "\.(php|lock|log)$">
        Require all denied
    </FilesMatch>

    AddType application/json .json
    # Apache ships no mapping for .webmanifest, so without this it goes out as
    # application/octet-stream. Chrome parses one anyway; Safari does not, and
    # X-Content-Type-Options is nosniff on this origin.
    AddType application/manifest+json .webmanifest
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/javascript \
            application/manifest+json image/svg+xml text/css text/plain
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/capmetro.error.log
    CustomLog ${APACHE_LOG_DIR}/capmetro.access.log combined
</VirtualHost>
