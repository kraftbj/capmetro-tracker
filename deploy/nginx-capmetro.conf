# CapMetro dispatch board — nginx vhost.
#
#   sed 's/@DOMAIN@/bus.example.com/; s#@WEBROOT@#/var/www/capmetro#' \
#     deploy/nginx-capmetro.conf > /etc/nginx/sites-available/capmetro
#
# Static files only. No PHP is reachable from the web: the runtime is a CLI job
# on a timer that writes JSON to disk, so there is no fastcgi_pass here and that
# is not an omission.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    # certbot --nginx rewrites this block to redirect to 443.
    root @WEBROOT@;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    # The JSON compresses about 10:1 and is the bulk of every page load.
    gzip_proxied any;
    gzip_vary on;

    # Nothing here is executable and nothing takes user input, so the policy can
    # be almost entirely closed. 'unsafe-inline' is absent on purpose: the client
    # has no inline script.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # --- the API the cron writes ------------------------------------------
    # Contract section 11: regenerated every 60s, so it must never be cached.
    location /api/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # Contract section 16: the departure boards carry nothing from a realtime
    # feed and change only when service_date or feed_version changes, both of
    # which are IN the payload. 2.8 MB re-fetched every minute for a document
    # that did not change is the waste this exists to avoid. Six hours is well
    # inside a service day and survives a midnight rollover being noticed late.
    location /api/departures/ {
        add_header Cache-Control "public, max-age=21600" always;
        add_header X-Content-Type-Options nosniff always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # --- the client -------------------------------------------------------
    # index.html is the only file that names the others, so it must revalidate
    # or a deploy is invisible until someone clears their cache.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Scripts and CSS change on deploy and are not fingerprinted. must-revalidate
    # keeps them correct at the cost of a conditional request each.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The generator's lock and state never belong on the web. They are outside
    # the webroot already; this is belt and braces for a misconfigured root.
    location ~ /\. { deny all; }
    location ~ \.(php|lock|log)$ { deny all; }

    access_log /var/log/nginx/capmetro.access.log;
    error_log  /var/log/nginx/capmetro.error.log;
}
