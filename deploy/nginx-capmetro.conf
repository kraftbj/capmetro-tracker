# CapMetro dispatch board — nginx vhost.
#
# `sudo deploy/install.sh --domain <host>` prints this sequence already filled
# in, and refuses a hostname that cannot work. Prefer it. By hand:
#
#   sed -e 's/@DOMAIN@/bus.dillo.dev/g' -e 's#@WEBROOT@#/var/www/capmetro#g' \
#     deploy/nginx-capmetro.conf > /tmp/capmetro-vhost.new
#   diff -u /etc/nginx/sites-available/capmetro /tmp/capmetro-vhost.new
#   [ -s /tmp/capmetro-vhost.new ] && ! grep -q '@[A-Z_]*@' /tmp/capmetro-vhost.new \
#     && cp /tmp/capmetro-vhost.new /etc/nginx/sites-available/capmetro
#
# Through a temp file, with a diff and a guard, rather than straight over the
# installed file, because every step there is load-bearing:
#
#   `>` truncates before sed runs, so a sed that FAILS leaves a 0-byte vhost.
#   An empty vhost adds no directives, so nginx -t passes, the host falls
#   through to default_server, and health.json still reads ok:true. A file left
#   holding @PLACEHOLDERS@ is accepted just as quietly. Hence -s and the grep.
#
#   On a TLS box the installed file is NOT this one: certbot --nginx rewrote it
#   to add the 443 server and the redirect. Copying over the top deletes the TLS
#   block and leaves the certificate valid and unreferenced, so the board leaves
#   HTTPS. Hence the diff, which is there to be read.
#
# Put the real host in that sed, never a stand-in. A server_name that nothing
# resolves to is what took the board down once already, and it is invisible: the
# config is valid, the reload is clean, and the check still reads ok:true.
# install.sh refuses that whole class of name, which is the better reason to use
# it than this header is to follow.
#
# Static files only. No PHP is reachable from the web: the runtime is a CLI job
# on a timer that writes JSON to disk, so there is no fastcgi_pass here and that
# is not an omission.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    # certbot --nginx rewrites this block to redirect to 443.
    root @WEBROOT@;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types application/json application/javascript application/manifest+json
               image/svg+xml text/css text/plain;
    gzip_min_length 1024;
    # The JSON compresses about 10:1 and is the bulk of every page load.
    gzip_proxied any;
    gzip_vary on;

    # Nothing here is executable and nothing takes user input, so the policy can
    # be almost entirely closed. 'unsafe-inline' is still absent on purpose. The
    # client has exactly ONE inline script -- the <base> bootstrap at the top of
    # index.html, which must run before any external script can be fetched at a
    # deep path -- and it is admitted by its sha256 hash rather than by opening
    # the door to every inline script on the origin.
    #
    # base-uri is 'self' rather than 'none' for the same bootstrap: 'none' makes
    # every <base> inert, however it is inserted, including one built with
    # createElement. 'self' still refuses an off-origin base, which is the attack
    # the directive exists for.
    #
    # manifest-src and worker-src are named rather than left to fall back. Both
    # fall back to default-src, which is 'none' here, so without them the browser
    # refuses manifest.webmanifest and sw.js -- the board is then not installable
    # and does not open offline, with one console line each and nothing else to
    # see. worker-src would in fact reach script-src through child-src, but
    # relying on a two-step fallback to keep a feature working is how it stops
    # working the next time script-src is edited.
    #
    # The hash is pinned by tests/node/deploy-vhost-headers.test.mjs, recomputed
    # from index.html on every run. Editing the snippet without updating these
    # strings fails the suite instead of silently blanking the board in
    # production, which is the one real hazard of hashing an inline script.
    #
    # These four are repeated verbatim in every location block below that sets a
    # header of its own, and that repetition is required, not sloppiness. nginx
    # inherits add_header from an enclosing level ONLY when the current level
    # declares none of its own: one add_header in a location silently discards
    # every inherited one. Because each location below sets Cache-Control, the
    # server-level set here reached only `location /`, which meant index.html --
    # the one HTML document on the origin, and the only thing a CSP can protect --
    # was served with no CSP, no Referrer-Policy and no X-Frame-Options.
    # `location /` still inherits, because it declares nothing.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # --- the API the cron writes ------------------------------------------
    # Contract section 11: regenerated every 60s, so it must never be cached.
    # `^~` is load-bearing, not decoration. A PLAIN prefix loses to any regex
    # location that also matches, wherever it is declared -- so the icon rule
    # below (`~* \.(png|svg|ico)$`, max-age=86400) would answer
    # /api/anything.png and the no-cache rule here would never run. Verified
    # under real nginx: with a plain prefix that request came back
    # `public, max-age=86400`. Nothing under /api/ is anything but .json today,
    # which is the only reason it has never bitten, and contract section 11 is
    # too important to leave resting on which extensions happen to exist.
    #
    # The modifier also stops /api/ reaching the `~ /\.` and
    # `~ \.(php|lock|log)$` deny blocks above. That costs nothing: try_files
    # here ends in =404, and nothing under the webroot executes.
    location ^~ /api/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # Contract section 16: the departure boards are almost entirely static and
    # turn over when service_date or feed_version changes, both of which are IN
    # the payload. 2.8 MB re-fetched every minute for a document that did not
    # change is the waste this exists to avoid. Six hours is well inside a
    # service day and survives a midnight rollover being noticed late.
    #
    # The one realtime field in here is trips[].canceled, and this cache DOES
    # freeze it. That is safe only because the client is required to union it
    # with schedule.canceled_trips from the route payload, which is served
    # no-cache above and rebuilt every 60s. See contract section 16. Do not
    # lengthen this max-age on the assumption the document is fully static.
    # Longer prefix, so it wins over /api/ for its own subtree; `^~` for the
    # same reason as above, since the modifier is not inherited.
    location ^~ /api/departures/ {
        add_header Cache-Control "public, max-age=21600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # --- the client -------------------------------------------------------
    # index.html is the only file that names the others, so it must revalidate
    # or a deploy is invisible until someone clears their cache.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # The generator's lock and state never belong on the web. They are outside
    # the webroot already; this is belt and braces for a misconfigured root.
    #
    # These sit ABOVE the asset and app-path blocks deliberately. nginx takes the
    # FIRST matching regex location, so declared later they were shadowed for any
    # path the blocks below match -- /route/4/.env and /trip/x.php reached the
    # app fallback, and /.hidden.js reached the asset block, neither ever
    # touching a deny. Belt and braces is worth nothing worn under the coat.
    location ~ /\. { deny all; }
    location ~ \.(php|lock|log)$ { deny all; }

    # The web app manifest. nginx's shipped mime.types has no entry for
    # .webmanifest, so without this it goes out as application/octet-stream --
    # which Chrome will still parse but Safari will not, and X-Content-Type-Options
    # is nosniff on this origin. An exact-match location, so it is chosen before
    # any regex block below whatever the declaration order.
    #
    # It revalidates for the same reason index.html does: it names every icon and
    # the start URL, it is 1 KB, and a cached one is how a renamed icon becomes a
    # blank square on somebody's home screen until they uninstall the thing.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Icons and the favicons. Not fingerprinted, but fetched by the launcher and
    # the tab rather than by the page, and they change roughly never -- a day is
    # long enough that a home screen is not re-fetching them, and short enough
    # that a recut icon lands without anyone clearing anything.
    #
    # Declared below the deny blocks above, like every other asset location, so
    # /route/4/.hidden.png cannot reach it.
    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Scripts and CSS change on deploy and are not fingerprinted. must-revalidate
    # keeps them correct at the cost of a conditional request each.
    #
    # sw.js is matched HERE and that is deliberate: the service worker script is
    # the one file whose staleness the worker cannot fix for itself, and every
    # browser caps its own service-worker script cache at 24 hours anyway.
    # must-revalidate makes the update check a conditional request instead.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-wmVx3uZ7psa/SmfsAPLWHF/CjUjO6NhX+n4qnx27vQ8='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Shareable URLs: /route/4/eb, /buses, /trip/1234, /saved, /stops. None of those are
    # files, so a real file is served when one exists and everything else falls
    # through to the board, which reads the path and renders the right view.
    #
    # Scoped to the five app verbs rather than a blanket fallback: a blanket one
    # answers 200 with the board's HTML for every typo and every missing asset,
    # so a mistyped script tag would look like it loaded. Anything outside these
    # five still 404s, which is what a 404 is for.
    #
    # /api/ is matched by its own location blocks above and never reaches here,
    # so a missing JSON file keeps returning 404 rather than a page of HTML the
    # client would try to parse.
    location ~ ^/(route|buses|trip|saved|stops)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/capmetro.access.log;
    error_log  /var/log/nginx/capmetro.error.log;
}
